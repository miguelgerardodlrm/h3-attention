[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-attention"
version = "0.1.0"
description = "Attention control for MiniMax H3 to reduce hallucination, identity drift, and reference loss during inference"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "diffusers>=0.41.0",
    "transformers>=5.0.0",
    "accelerate>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
sage = [
    "sageattention>=0.1.0",
]

[project.urls]
Repository = "https://github.com/miguelgerardodlrm/h3-attention"
Issues = "https://github.com/miguelgerardodlrm/h3-attention/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["h3_attention*", "comfyui_nodes*"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "ARG", "PTH", "T20", "SIM", "RET"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
